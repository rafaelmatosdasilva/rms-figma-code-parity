<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype</title>
<style>
/* The design system's own CSS: its tokens in every mode and its components' rules. Nothing else styles the prototype. */
/*{{THEME_CSS}}*/
/*{{COMPONENT_CSS}}*/
</style>
<style>
/* The bar above the prototype is the engine's, not the design system's: it keeps to its own prefixed classes. */
html, body { margin: 0; }
.pt-bar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 16px; font: 13px/1.4 system-ui, sans-serif; color: #1d1d1f; background: #f5f5f7; border-bottom: 1px solid #d2d2d7; }
.pt-bar h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 600; }
.pt-bar button { font: inherit; padding: 4px 10px; border: 1px solid #c7c7cc; border-radius: 6px; background: #fff; color: inherit; cursor: pointer; }
.pt-bar button[aria-pressed="true"] { background: #1d1d1f; color: #fff; border-color: #1d1d1f; }
.pt-seg { display: inline-flex; gap: 4px; }
.pt-note { color: #6e6e73; }
.pt-gaps { font: 13px/1.5 system-ui, sans-serif; color: #1d1d1f; background: #fffbe6; border-bottom: 1px solid #e8d97a; padding: 10px 16px; }
.pt-gaps h2 { font-size: 13px; margin: 0 0 4px; }
.pt-gaps ul { margin: 0; padding-left: 18px; }
.pt-gaps[hidden] { display: none; }
/* The engine's neutral pieces: arrangement only. Outlined only when asked, so the prototype looks as it will. */
.pt-engine { box-sizing: border-box; }
.pt-show .pt-engine { outline: 1px dashed #8e8e93; outline-offset: -1px; }
.pt-show [data-pt-standin] { outline: 2px solid #ff9f0a; outline-offset: 2px; }
.pt-missing-box { display: flex !important; flex-direction: column; align-items: stretch !important; justify-content: flex-start !important; gap: 4px; }
.pt-missing-cap { font: 11px/1.4 system-ui, sans-serif; color: #6e6e73; }
.pt-missing { box-sizing: border-box; display: flex; align-items: center; justify-content: center; min-height: 40px; padding: 8px 12px; border: 1px dashed #8e8e93; border-radius: 4px; font: 12px/1.4 system-ui, sans-serif; color: #6e6e73; background: repeating-linear-gradient(45deg, transparent 0 6px, rgba(142,142,147,.08) 6px 12px); }
</style>
</head>
<body>
<!--{{ICON_SHEET}}-->
<div class="pt-bar" role="toolbar" aria-label="Prototype">
  <h1 id="pt-title">Prototype</h1>
  <span class="pt-seg" id="pt-modes"></span>
  <button type="button" id="pt-outline" aria-pressed="false">Show engine layout and stand-ins</button>
  <button type="button" id="pt-gaps-toggle" aria-pressed="false">Gaps</button>
  <span class="pt-note" id="pt-note"></span>
</div>
<section class="pt-gaps" id="pt-gaps" hidden><h2>What the design system would need</h2><ul></ul></section>
<main id="pt-canvas"></main>
<script type="application/json" id="pt-data">/*{{PROTOTYPE}}*/</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById('pt-data').textContent || '{}');
  var html = document.documentElement, canvas = document.getElementById('pt-canvas');
  var COMP = D.components || {}, SCALES = D.scales || { spacing: [], text: [] };
  document.title = D.name ? D.name + ' · prototype' : 'Prototype';
  document.getElementById('pt-title').textContent = D.name || 'Prototype';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function space(name) { if (!name || name === 'none') return '0'; var t = SCALES.spacing.find(function (s) { return s.name === name; }); return t ? 'var(' + t.var + ', ' + t.value + ')' : '0'; }

  // A system component, drawn as the style guide draws it: its own markup, then each option's own effect.
  function baseElement(c) {
    if (c.markup) { var t = document.createElement('template'); t.innerHTML = c.markup.trim(); var first = t.content.firstElementChild; if (first) return first; }
    var e;
    switch (c.role) {
      case 'button': e = document.createElement('button'); e.type = 'button'; break;
      case 'togglebutton': e = document.createElement('button'); e.type = 'button'; e.setAttribute('aria-pressed', 'false'); break;
      case 'textbox': case 'textinput': e = document.createElement('input'); e.type = 'text'; e.setAttribute('aria-label', c.name); break;
      case 'checkbox': case 'radio': e = document.createElement('input'); e.type = c.role; e.setAttribute('aria-label', c.name); break;
      case 'switch': e = document.createElement('button'); e.type = 'button'; e.setAttribute('role', 'switch'); e.setAttribute('aria-checked', 'false'); break;
      case 'link': e = document.createElement('a'); e.href = '#'; break;
      default: e = document.createElement('span');
    }
    if (c.cls) e.classList.add(c.cls);
    if (e.tagName !== 'INPUT') e.textContent = c.name;
    return e;
  }
  function applyEffect(e, effect, on) {
    if (!effect) return;
    (effect.add || []).forEach(function (k) { e.classList.toggle(k, on); });
    Object.keys(effect.attrs || {}).forEach(function (a) { if (on) e.setAttribute(a, effect.attrs[a]); else e.removeAttribute(a); });
  }
  function partsOf(e, sel) { try { return sel ? Array.prototype.slice.call(e.querySelectorAll(sel)) : []; } catch (x) { return []; } }
  function textLeaf(e, sel) {
    if (e.tagName === 'INPUT') return e;
    var inner = e.querySelector('input, textarea'); if (inner && !e.textContent.trim()) return inner;
    var named = partsOf(e, sel).find(function (k) { return !k.closest('svg') && k.textContent.trim(); });
    if (named) return named;
    var leaf = e;
    while (leaf.firstElementChild) { var next = Array.prototype.find.call(leaf.children, function (k) { return k.tagName.toLowerCase() !== 'svg' && k.textContent.trim(); }); if (!next) break; leaf = next; }
    return leaf;
  }
  function truthy(v) { return v === true || /^true$/i.test(String(v)); }
  // An option Figma and the code do not share by name is drawn on the part its name points to: TitleContent writes the
  // element whose class says title, "Show Description" off removes the one that says description, a label goes where
  // the component's text is. A page instance's own state (hidden, placed absolutely on its page) is taken off.
  function keyWord(prop) { return String(prop).replace(/^show[\s_-]*/i, '').replace(/[\s_-]*content$/i, '').replace(/[\s_-]+/g, '').toLowerCase(); }
  function partFor(e, word) {
    if (!word) return null;
    var all = Array.prototype.slice.call(e.querySelectorAll('[class]'));
    var hit = all.find(function (k) { return (k.getAttribute('class') || '').toLowerCase().split(/[\s_-]+/).some(function (c) { return c === word || (c.length >= 4 && word.indexOf(c) === 0) || (word.length >= 4 && c.indexOf(word) === 0); }); });
    if (hit) return hit;
    if (word === 'icon') return e.querySelector('svg');
    return null;
  }
  function setText(el, v) {
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') { el.value = v; return; }
    if (!el.querySelector('svg')) { el.textContent = v; return; }
    var tn = Array.prototype.find.call(el.childNodes, function (n) { return n.nodeType === 3 && n.textContent.trim(); });
    var span = Array.prototype.find.call(el.children, function (k) { return k.tagName !== 'svg' && !k.querySelector('svg'); });
    if (tn) tn.textContent = v; else if (span) span.textContent = v; else { var t = document.createElement('span'); t.textContent = v; el.appendChild(t); }
  }
  function cleanInstance(e) {
    Array.prototype.slice.call(e.classList).forEach(function (k) { if (/^(hidden|is-hidden|d-none|invisible)$/.test(k)) e.classList.remove(k); });
    e.removeAttribute('hidden');
    ['position', 'inset', 'top', 'left', 'right', 'bottom'].forEach(function (k) { e.style[k] = ''; });
    if (e.style.display === 'none') e.style.display = '';
  }
  function byName(e, c, p, done) {
    Object.keys(p).forEach(function (k) {
      if (done[k] || k === 'standInFor') return;
      var word = keyWord(k);
      if ((c.boolProps || {})[k]) { if (!truthy(p[k])) { var gone = partFor(e, word); if (gone && gone !== e) gone.remove(); } return; }
      if (!Object.prototype.hasOwnProperty.call(c.textProps || {}, k) || p[k] == null || p[k] === '') return;
      var dflt = String(c.textProps[k] || '').trim().toLowerCase();
      var target = partFor(e, word);
      if (!target && dflt) target = Array.prototype.slice.call(e.querySelectorAll('*')).find(function (x) { return !x.children.length && x.textContent.trim().toLowerCase() === dflt; }) || null;
      if (!target && (word === 'label' || word === 'title' || word === 'text')) target = e;
      if (target) setText(target, String(p[k]));
    });
  }
  function systemComponent(node) {
    var c = COMP[node.component];
    if (!c) {
      // A component the code does not have: a labelled box, and what the screen put in it stays visible inside.
      if ((node.children || []).length) { var box = document.createElement('div'); box.className = 'pt-missing pt-missing-box'; box.setAttribute('role', 'group'); box.setAttribute('aria-label', node.component + ' (not built in the code yet)'); var cap = document.createElement('div'); cap.className = 'pt-missing-cap'; cap.textContent = node.component + ' (not built in the code yet)'; box.appendChild(cap); return box; }
      return missing(node.component + ' (not built in the code yet)');
    }
    var e = baseElement(c), p = node.props || {}, done = {};
    if (c.markup) cleanInstance(e);
    else { var words = Object.keys(c.textProps || {}).map(function (k) { return p[k]; }).filter(function (v) { return v != null && v !== ''; }); if (words.length) e.textContent = words.join(' · '); }
    (c.controls || []).forEach(function (ctl) {
      done[ctl.label] = 1; done[ctl.prop] = 1;
      var has = Object.prototype.hasOwnProperty.call(p, ctl.label) ? p[ctl.label] : (Object.prototype.hasOwnProperty.call(p, ctl.prop) ? p[ctl.prop] : undefined);
      var v = has === undefined ? ctl.default : has;
      if (ctl.type === 'VARIANT') (ctl.options || []).forEach(function (o) { applyEffect(e, o, o.label === String(v)); });
      else if (ctl.type === 'BOOLEAN') {
        if (ctl.on) applyEffect(e, ctl.on, truthy(v));
        else if (ctl.part && !truthy(v)) partsOf(e, ctl.part).forEach(function (k) { if (k !== e) k.remove(); });
      } else if (ctl.type === 'TEXT' && v != null && v !== '') { var leaf = textLeaf(e, ctl.part); if (leaf.tagName === 'INPUT' || leaf.tagName === 'TEXTAREA') leaf.placeholder = v; else leaf.textContent = v; }
    });
    if (c.markup) byName(e, c, p, done);
    if (p.standInFor) { e.setAttribute('data-pt-standin', ''); e.title = 'Stand-in for ' + p.standInFor; }
    return e;
  }
  function missing(need) { var m = document.createElement('div'); m.className = 'pt-missing'; m.setAttribute('role', 'note'); m.textContent = 'Missing: ' + need; return m; }

  // The engine's neutral pieces: arrangement and copy, with the system's spacing and text styles only.
  function piece(node) {
    var p = node.props || {}, e;
    if (node.component === 'Missing') return missing(p.need || 'unnamed need');
    if (node.component === 'Text') {
      e = document.createElement(/^(h1|h2|h3|p|span)$/.test(p.as) ? p.as : 'p');
      e.className = 'pt-text'; e.style.margin = '0';
      var st = SCALES.text.find(function (t) { return t.name === p.style; });
      if (st) { e.style.fontSize = st.size; e.style.fontWeight = st.weight; e.style.lineHeight = st.lh; if (st.family) e.style.fontFamily = st.family; }
      e.textContent = p.text || '';
      return e;
    }
    e = document.createElement(node.component === 'Page' ? 'div' : 'div');
    e.className = 'pt-engine'; e.setAttribute('data-engine', node.component);
    if (truthy(p.grow)) { e.style.flex = '1 1 0'; e.style.minWidth = '0'; e.style.minHeight = '0'; }
    if (node.component === 'Page' && /^\d+$/.test(String(p.width || ''))) { e.style.width = p.width + 'px'; e.style.maxWidth = '100%'; }
    e.style.padding = space(p.padding); e.style.gap = space(p.gap);
    if (node.component === 'Page') {
      e.style.display = 'flex'; e.style.flexDirection = 'column'; e.style.minHeight = 'calc(100vh - 48px)';
      if (SCALES.surface) e.style.background = 'var(' + SCALES.surface + ')';
      if (SCALES.ink) e.style.color = 'var(' + SCALES.ink + ')';
      if (SCALES.family) e.style.fontFamily = SCALES.family;
    } else if (node.component === 'Stack') { e.style.display = 'flex'; e.style.flexDirection = 'column'; }
    else if (node.component === 'Row') { e.style.display = 'flex'; e.style.flexDirection = 'row'; if (truthy(p.wrap)) e.style.flexWrap = 'wrap'; e.style.justifyContent = { between: 'space-between', start: 'flex-start', end: 'flex-end', center: 'center' }[p.justify] || 'flex-start'; }
    else if (node.component === 'Columns') { e.style.display = 'grid'; e.style.gridTemplateColumns = 'repeat(' + (parseInt(p.count, 10) || 2) + ', minmax(0, 1fr))'; }
    // As in Figma's auto layout, children keep their own size unless the arrangement says stretch.
    e.style.alignItems = { start: 'flex-start', end: 'flex-end', center: 'center', stretch: 'stretch', baseline: 'baseline' }[p.align] || (node.component === 'Columns' ? 'stretch' : 'flex-start');
    return e;
  }
  function draw(node) {
    var isPiece = (D.pieces || []).indexOf(node.component) >= 0;
    var e = isPiece ? piece(node) : systemComponent(node);
    // A system component's children go in its slot: the part its markup names slot, content or body, else itself.
    var into = e;
    // With no slot part, what the composition puts inside replaces the copy's own page content.
    if (!isPiece && (node.children || []).length) { var slot = e.querySelector('[class*="slot" i], [class*="content" i], [class*="body" i], [class*="main" i]'); if (slot) { slot.innerHTML = ''; into = slot; } else e.innerHTML = ''; }
    (node.children || []).forEach(function (k) { into.appendChild(draw(k)); });
    return e;
  }
  if (D.tree) canvas.appendChild(draw(D.tree));

  // The system's own modes (colour and size), as in the style guide.
  (D.modes || []).forEach(function (axis) {
    var box = document.getElementById('pt-modes');
    axis.values.forEach(function (v, i) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = v.label; b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
      b.addEventListener('click', function () {
        if (axis.classes) { axis.values.forEach(function (x) { if (x.value) html.classList.remove(x.value); }); if (v.value) html.classList.add(v.value); }
        else if (!v.value) html.removeAttribute(axis.attr); else html.setAttribute(axis.attr, v.value);
        box.querySelectorAll('button').forEach(function (x) { if (x.parentNode === box && axis.values.some(function (y) { return y.label === x.textContent; })) x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      });
      box.appendChild(b);
    });
  });
  var outline = document.getElementById('pt-outline');
  outline.addEventListener('click', function () { var on = outline.getAttribute('aria-pressed') !== 'true'; outline.setAttribute('aria-pressed', String(on)); canvas.classList.toggle('pt-show', on); });
  var gaps = D.gaps || [], panel = document.getElementById('pt-gaps'), gt = document.getElementById('pt-gaps-toggle');
  panel.querySelector('ul').innerHTML = gaps.length ? gaps.map(function (g) { return '<li>' + esc(g) + '</li>'; }).join('') : '<li>Nothing: everything here is the design system\'s own.</li>';
  gt.textContent = 'Gaps (' + gaps.length + ')';
  gt.addEventListener('click', function () { var on = panel.hidden; panel.hidden = !on; gt.setAttribute('aria-pressed', String(on)); });
  document.getElementById('pt-note').textContent = D.note || '';
})();
</script>
</body>
</html>
