name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The browser tests use the runner's Chrome (found on PATH); without it they skip.
      - name: Run the test suite
        run: node --test test/*.test.mjs
